# bus-pooling · 生产 docker-compose · vps22 部署用
#
# 使用方式（vps22 上）：
#   1. clone: git clone git@github.com:greenSheep999/bus-pooling.git /opt/bus-pooling
#   2. cd /opt/bus-pooling
#   3. 准备 .env（BP_MASTER_KEY + 6 家 vendor API key 等 · 不进 git）
#   4. 准备 config.yaml（default_vendor / promo / community · 不进 git）
#   5. docker login ghcr.io -u greenSheep999 -p <PAT-with-read:packages>
#   6. docker compose pull && docker compose up -d
#
# 镜像来源：GitHub Actions 的 ghcr-build.yml 构建 · 不在服务器本地 build。
# Caddy 反代 kirobus.com → 127.0.0.1:9917 已配置（Caddyfile 已有）。

services:
  app:
    image: ${KIROBUS_IMAGE:-ghcr.io/greensheep999/bus-pooling:kirobus}
    container_name: kirobus
    restart: unless-stopped

    ports:
      - "127.0.0.1:9917:8080"

    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro

    env_file:
      - .env

    environment:
      TZ: ${TZ:-Asia/Shanghai}

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
