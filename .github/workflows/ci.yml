name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端 · build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        # DRY_RUN=1：CI 里绝不真实调 vendor（会扣钱）
        # -timeout 30m · -race 让 SQLite 慢 3-5x · api 包 300+ 测试单包 20 分钟才够
        # 老 CI 默认 10 分钟 · billing 恢复后跑的第一次因为 timeout 挂了 · 拉大
        # 后续优化 · setupTestDB 加 template db cache 减 migration 时间
        env:
          DRY_RUN: "1"
        run: go test -race -timeout 30m ./...

      - name: 敏感字扫描
        # 交付验收要求（sprint-1a-backend）· 明文凭证不许进仓库
        run: |
          if grep -rnE 'sk-[a-zA-Z0-9]{20}|usr-[a-f0-9]{32}|BP_MASTER_KEY=[0-9a-f]{64}' \
               --include='*.go' --include='*.yaml' --include='*.yml' --include='*.sql' . ; then
            echo "::error::发现疑似明文凭证"
            exit 1
          fi

  frontend:
    name: 前端 · build + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # tsc -b 才是真检查（根 tsconfig 用 project references，单跑 tsc --noEmit 什么都不查）
      - run: npm run build

      - run: npm run lint

      # i18n 漏词条 · tsc/oxlint 都查不到（key 不存在时 i18next 静默回落）
      - run: npm run check:i18n
